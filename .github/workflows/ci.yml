name: CI

on:
  push:
  pull_request:
  # Run on demand from the Actions tab, so a Windows build can be produced without pushing
  # (the windows job uploads a runnable folder as the earthview-win64 artifact).
  workflow_dispatch:
  # Weekly master run: restores (touches) the vcpkg cache so GitHub's 7-day-unused eviction
  # never drops the osgEarth build. See the cache policy at the Windows cache steps.
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC (scheduled runs use the default branch)

# Push and pull_request runs of one branch share a group, so a newer run replaces an older
# one instead of building osgEarth twice in parallel (the partial vcpkg cache is kept).
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libqt6opengl6-dev libgl1-mesa-dev zlib1g-dev xvfb gdal-bin
      - name: Configure
        run: cmake -S EarthView -B out -G Ninja -DEARTHVIEW_DEPLOY_QT=OFF
      - name: Build
        run: cmake --build out
      - name: Test
        run: ctest --test-dir out --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Snapshot smoke render
        working-directory: out
        env:
          EARTHVIEW_FORCE_SOFTWARE_OPENGL: "1"
        run: |
          xvfb-run -a ./earthview_snapshot --mode mercator --lat 30 --lon 70 --zoom 3 -o snapshot-mercator.png
          xvfb-run -a ./earthview_snapshot --mode orthographic --lat 30 --lon 70 --zoom 2 -o snapshot-orthographic.png
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: out/snapshot-*.png

  # MSVC build of EarthView 2D + earthview3d (osgEarth from the repo vcpkg manifest).
  # The first run builds osgEarth and its dependencies (1-3 h); later runs restore the
  # vcpkg binary cache and take minutes. Visual checks stay human (no GPU on CI).
  windows:
    runs-on: windows-latest
    timeout-minutes: 350
    env:
      VCPKG_COMMIT: 2cfff9c458d9dcf642e9fa09ba624f9931bb5358   # = builtin-baseline in vcpkg.json
      # Not VCPKG_ROOT: msvc-dev-cmd overwrites that with Visual Studio's bundled vcpkg.
      EV_VCPKG_ROOT: C:\ev-vcpkg
      VCPKG_CACHE: C:\ev-vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,C:\ev-vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          arch: win64_msvc2022_64
          cache: true
          # aqtinstall 3.3.0 (latest release) cannot find Qt >= 6.11 on Windows (packages moved to
          # per-compiler extension repositories); master has the fix (#1000). Drop once 3.4 ships.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get vcpkg at the manifest baseline
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:EV_VCPKG_ROOT
          git -C $env:EV_VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:EV_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $env:VCPKG_CACHE | Out-Null

      # Cache policy (D-019): every run restores the vcpkg binary cache (exact key, then the
      # newest partial), but only master saves it. GitHub scopes caches by branch: a cache
      # saved on a PR/feature branch is invisible to master and other branches, so per-branch
      # saves only duplicated the ~1 GB osgEarth cache and pushed the repo toward the 10 GB
      # limit. Master saves a complete cache when keyed by manifest, or a partial one when a
      # run fails part-way, so an interrupted master build resumes instead of starting over.
      # A dependency change (vcpkg.json / baseline) therefore builds once on its PR without
      # saving, and again on master after merge, which then serves every branch.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\ev-vcpkg-cache
          key: vcpkg-win-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-full
          restore-keys: |
            vcpkg-win-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-partial-

      - name: Configure (installs osgEarth via vcpkg)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\ev-vcpkg
        run: >
          cmake -S EarthView -B build-msvc -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          "-DCMAKE_TOOLCHAIN_FILE=$env:EV_VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          "-DVCPKG_MANIFEST_DIR=${{ github.workspace }}"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          -DEARTHVIEW_DEPLOY_QT=OFF
          -DEARTHVIEW_BUILD_3D=ON

      - name: Save complete vcpkg cache
        if: success() && github.ref == 'refs/heads/master' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\ev-vcpkg-cache
          key: vcpkg-win-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-full

      - name: Save partial vcpkg cache
        if: (failure() || cancelled()) && github.ref == 'refs/heads/master' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\ev-vcpkg-cache
          key: vcpkg-win-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-partial-${{ github.run_id }}

      - name: Collect vcpkg logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vcpkg-logs | Out-Null
          Get-ChildItem "$env:EV_VCPKG_ROOT\buildtrees" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName ("vcpkg-logs\" + $_.Directory.Name + "-" + $_.Name) }
          Copy-Item build-msvc\vcpkg-manifest-install.log vcpkg-logs\ -ErrorAction SilentlyContinue

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: vcpkg-logs
          if-no-files-found: ignore

      - name: Build
        run: cmake --build build-msvc --parallel

      - name: Test
        run: ctest --test-dir build-msvc --output-on-failure

      # Package a runnable folder so a Windows build can be downloaded without MSVC, Qt,
      # vcpkg or osgEarth installed locally. The job already builds and tests all three
      # executables; without this they were discarded. Visual checks still need a GPU.
      #
      # Paths are discovered rather than hard-coded: the generator (Ninja here, Visual
      # Studio locally) decides whether there is a per-config subdirectory, and vcpkg's
      # install tree sits under the build directory or the manifest directory depending on
      # VCPKG_INSTALLED_DIR.
      - name: Package Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist\earthview-win64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 1. The three product executables, by name. Do not glob for *.exe: vcpkg installs
          #    into build-msvc\vcpkg_installed, so a recursive glob also picks up vcpkg's own
          #    tools (sqlite3, protoc, bomtool, brotli, ...) and CMake's compiler-probe binary,
          #    and windeployqt then fails on the first one that is not a Qt application.
          $wanted = 'EarthView.exe', 'earthview_snapshot.exe', 'earthview3d_demo.exe'
          foreach ($name in $wanted) {
            $hit = Get-ChildItem build-msvc -Recurse -File -Filter $name |
                   Where-Object { $_.FullName -notmatch '\\vcpkg_installed\\' } |
                   Select-Object -First 1
            if (-not $hit) { throw "built executable $name not found under build-msvc" }
            Copy-Item $hit.FullName $stage -Force
            Write-Host "Executable: $($hit.FullName)"
          }

          # 2. Qt runtime: this job configures with EARTHVIEW_DEPLOY_QT=OFF, so the
          #    post-build windeployqt never ran. --compiler-runtime adds the MSVC
          #    redistributable DLLs so the folder runs on a machine without VS.
          $windeployqt = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
          if (-not (Test-Path $windeployqt)) { throw "windeployqt not found at $windeployqt" }
          foreach ($exe in Get-ChildItem $stage -Filter *.exe) {
            & $windeployqt --release --no-translations --compiler-runtime `
                           --dir $stage $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for $($exe.Name)" }
          }

          # 3. osgEarth / OSG / GDAL / PROJ runtime, the OSG plugin folder, and the GDAL and
          #    PROJ data directories that configureRuntime() resolves at startup (D-017,
          #    D-025 — the plugin folder is what makes osgdb_freetype and the label fonts
          #    work, so a package without it loses every non-ASCII glyph).
          $tree = @(
            (Join-Path $env:GITHUB_WORKSPACE 'build-msvc\vcpkg_installed\x64-windows'),
            (Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed\x64-windows')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $tree) {
            $tree = (Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Directory -Filter 'x64-windows' `
                       -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match 'vcpkg_installed' } |
                     Select-Object -First 1).FullName
          }
          if (-not $tree) { throw 'vcpkg installed tree (x64-windows) not found' }
          Write-Host "vcpkg tree: $tree"

          Copy-Item "$tree\bin\*.dll" $stage -Force

          # vcpkg puts the OSG plugins in <tree>\plugins\osgPlugins-<version>, not in bin;
          # earthview3d/CMakeLists.txt reads the same path for
          # EARTHVIEW3D_DEV_OSG_PLUGIN_DIR. The package keeps the parent folder, because
          # configureRuntime() adds the *parent* of osgPlugins-<version> to osgDB's library
          # path list. The directory listing is logged so a layout change is diagnosable
          # from the failure alone.
          Write-Host "vcpkg tree contains: $((Get-ChildItem $tree -Directory | ForEach-Object Name) -join ', ')"
          $plugins = Get-ChildItem "$tree\plugins" -Directory -Filter 'osgPlugins-*' -ErrorAction SilentlyContinue
          if (-not $plugins) {
            $plugins = Get-ChildItem $tree -Recurse -Directory -Filter 'osgPlugins-*' -ErrorAction SilentlyContinue
          }
          if (-not $plugins) { throw "no osgPlugins-* folder anywhere under $tree" }
          New-Item -ItemType Directory -Force -Path "$stage\plugins" | Out-Null
          $plugins | ForEach-Object { Copy-Item $_.FullName "$stage\plugins" -Recurse -Force }
          Write-Host "OSG plugins: $(($plugins | ForEach-Object Name) -join ', ')"

          # Fatal, not a warning: without share\gdal and share\proj the package starts and
          # then misbehaves on projections and imagery, which reads like a code bug rather
          # than a missing file. Every other guard here is fatal for the same reason.
          New-Item -ItemType Directory -Force -Path "$stage\share" | Out-Null
          foreach ($d in 'gdal', 'proj') {
            if (-not (Test-Path "$tree\share\$d")) { throw "$tree\share\$d not found - $d data cannot be packaged" }
            Copy-Item "$tree\share\$d" "$stage\share" -Recurse -Force
            Write-Host "$d data: $((Get-ChildItem "$stage\share\$d" -Recurse -File).Count) files"
          }

          # 4. Earth files, models and the committed world base imagery.
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'EarthView\Data') $stage -Recurse -Force

          # 4b. GLSL shaders. All three targets have a POST_BUILD step copying shaders\ next
          #     to their own executable, and ShaderUtils searches
          #     applicationDirPath()/shaders first. Staging the .exe files alone drops that
          #     sibling folder, and the 2D app then logs "Could not find shader files ..."
          #     for every program. One copy serves all three, since they now share a folder.
          $shaders = Join-Path $env:GITHUB_WORKSPACE 'EarthView\shaders'
          if (-not (Test-Path $shaders)) { throw "shaders folder not found at $shaders" }
          Copy-Item $shaders $stage -Recurse -Force
          Write-Host "Shaders: $((Get-ChildItem "$stage\shaders" -File).Count) files"

          # 5. Launchers. Without these the package starts but cannot work:
          #    RuntimePaths::buildTreeDefaults() carries only the compile-time CI build-tree
          #    paths, which do not exist on a downloaded copy, and configureRuntime() skips a
          #    directory that is not there — so no OSG plugin folder is registered and no
          #    GDAL/PROJ data is found. applyDataEnvironment() deliberately never overrides a
          #    variable that is already set, and osgDB reads OSG_LIBRARY_PATH when its DLL
          #    loads, so setting these before launch is the supported way to run from an
          #    arbitrary folder (D-017, D-025). Resolving deployed paths inside the library is
          #    roadmap task E7; until then the launcher is what makes the package portable.
          $template = @'
          @echo off
          rem Portable launcher: point the osgEarth runtime at the folders in this package.
          rem The executables carry the CI build-tree paths compiled in, which do not exist here,
          rem so the paths must come from the environment (see D-017/D-025 and roadmap E7).
          setlocal
          set "EV_HOME=%~dp0"
          set "OSG_LIBRARY_PATH=%EV_HOME%plugins"
          set "GDAL_DATA=%EV_HOME%share\gdal"
          set "PROJ_DATA=%EV_HOME%share\proj"
          set "PROJ_LIB=%EV_HOME%share\proj"
          "%EV_HOME%__EXE__" __ARGS__ %*
          '@
          # earthview3d_demo's --data-root defaults to EARTHVIEW3D_DEFAULT_DATA_ROOT, which
          # CMake bakes in as an absolute path into the source tree it was built from. On a
          # downloaded copy that directory does not exist, MapConfig::validate() returns
          # "Data root ... does not exist" and main() exits 2 before a window appears -- the
          # 3D demo closing immediately. Point it at the Data folder in this package; a
          # --data-root the user passes still wins, because it comes later on the line.
          $extraArgs = @{ 'earthview3d_demo.exe' = '--data-root "%EV_HOME%Data"' }
          foreach ($name in $wanted) {
            $cmd = 'run-' + [IO.Path]::GetFileNameWithoutExtension($name) + '.cmd'
            $extra = if ($extraArgs.ContainsKey($name)) { $extraArgs[$name] } else { '' }
            $template.Replace('__EXE__', $name).Replace('__ARGS__', $extra) |
              Set-Content -Path (Join-Path $stage $cmd) -Encoding ASCII
            Write-Host "Launcher: $cmd -> $name $extra"
          }

          $readme = @'
          EarthView - Windows x64 build
          =============================

          Built by CI with MSVC, Qt 6.11 (msvc2022_64) and osgEarth 3.8.1 from the pinned vcpkg
          manifest. Nothing needs to be installed: Qt, osgEarth, OSG, GDAL and PROJ are all in
          this folder, along with the MSVC redistributable DLLs.

          Start it with one of the launchers, NOT the .exe directly:

            run-earthview3d_demo.cmd     3D / stealth view demo host (osgEarth)
            run-EarthView.cmd            2D map application
            run-earthview_snapshot.cmd   offscreen snapshot tool

          The launchers set OSG_LIBRARY_PATH, GDAL_DATA and PROJ_DATA to the folders here. The
          executables have the CI build-tree paths compiled in, so running an .exe directly means
          osgEarth finds no plugin folder and no GDAL/PROJ data: the 3D view then fails to load
          fonts and imagery. Any argument you pass to a launcher is forwarded, e.g.

            run-earthview3d_demo.cmd --view stealth --entities 50

          What the launchers set up for you
          ---------------------------------
          OSG_LIBRARY_PATH, GDAL_DATA and PROJ_DATA point at this folder, and the 3D demo
          is given --data-root for the Data folder here. Both are needed because the
          executables have absolute paths from the CI build machine compiled in: the 3D
          demo would otherwise exit immediately with "Data root ... does not exist", and
          osgEarth would find no plugins or projection data. The shaders folder must also
          stay next to the executables, or the 2D app logs "Could not find shader files".

          Offline map data
          ----------------
          Only the committed world base imagery (Data/imagery/world_base.tif) ships here, so the
          default map is land/sea at low resolution. For the full offline map - AOI base map,
          hillshade and place names - run EarthView/tools/offline_data/build_offline_data.py from
          a checkout; it needs the GDAL command-line tools and is not run by CI.
          '@
          $readme | Set-Content -Path (Join-Path $stage 'README.txt') -Encoding ASCII

          "{0:N1} MB packaged" -f ((Get-ChildItem $stage -Recurse -File |
              Measure-Object -Property Length -Sum).Sum / 1MB)
          Get-ChildItem $stage | Select-Object Mode, Name | Format-Table | Out-String

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: earthview-win64
          path: dist/earthview-win64
          retention-days: 14
